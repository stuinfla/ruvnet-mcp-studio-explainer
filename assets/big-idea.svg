<text x="464" y="212" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">/api/mcp</text>
