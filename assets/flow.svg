  <text x="328" y="80" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="30" font-weight="800" fill="#ff8a3d" text-anchor="middle" opacity="0.45" filter="url(#glowS)">What happens to your data</text>
