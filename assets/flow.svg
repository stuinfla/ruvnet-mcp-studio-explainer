<text x="328" y="171" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="18.5" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">Request hits /api/mcp</text>
