<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 905" width="824" height="905" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">mcp-studio — Architecture</title>
  <desc id="d-desc">The parts a reader must hold in mind: the endpoint, the tool and resource catalog, the widget bundle, and the attributed template set it renders.</desc>
  <metadata><![CDATA[
Streamable HTTP endpoint (/api/mcp) -> Tool and resource catalog (lib/catalog.ts) -> MCP Apps widget bundle -> Browser playground UI -> Five attributed dashboard templates
]]></metadata>
  <style>
    .flow-line { stroke-dasharray: 8 10; stroke-width: 3; animation: flow-dash 1.1s linear infinite; }
    @keyframes flow-dash { to { stroke-dashoffset: -36; } }
    .node-pulse { transform-box: fill-box; transform-origin: center; animation: node-pulse 2.1s cubic-bezier(0.4,0,0.2,1) infinite; }
    @keyframes node-pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .flow-line, .node-pulse { animation: none; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b1018"/><stop offset="0.55" stop-color="#0a0e15"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.02" r="0.8">
      <stop offset="0" stop-color="rgba(255,138,61,0.1)"/><stop offset="0.5" stop-color="rgba(255,138,61,0.025)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.09)"/><stop offset="0.5" stop-color="rgba(255,255,255,0.015)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.014)"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="glowS" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cardSh" x="-40%" y="-50%" width="180%" height="210%">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <!-- concept archetype: strata -->
  <rect x="0" y="0" width="824" height="905" fill="url(#bg)"/>
  <rect x="0" y="0" width="824" height="905" fill="url(#spot)"/>
  <rect x="0" y="0" width="824" height="905" fill="url(#grid)"/>
<text x="412" y="44" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Monaco,Consolas,monospace" font-size="13" font-weight="600" fill="#ff8a3d" text-anchor="middle" letter-spacing="3">MCP-STUDIO · ARCHITECTURE</text>
  <text x="412" y="80" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="30" font-weight="800" fill="#ff8a3d" text-anchor="middle" opacity="0.45" filter="url(#glowS)">How it is built</text>
<text x="412" y="80" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="middle">How it is built</text>
  <line x1="378" y1="98" x2="446" y2="98" stroke="#ff8a3d" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <rect x="87.0" y="145.0" width="650" height="650" rx="30" fill="#ff8a3d" opacity="0.16" filter="url(#glow)"/>
  <rect x="92.0" y="150.0" width="640" height="640" rx="26" fill="rgba(255,138,61,0.09)" stroke="rgba(255,138,61,0.5)" stroke-width="1.5"/>
  <rect x="92.0" y="150.0" width="640" height="640" rx="26" fill="url(#sheen)" opacity="0.3"/>
  <circle class="node-pulse" cx="114.0" cy="170.0" r="4.5" fill="#ff8a3d" opacity="0.4" filter="url(#glowS)"/>
  <circle cx="114.0" cy="170.0" r="3" fill="#ffb98b"/>
<text x="412" y="170" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">Streamable HTTP endpoint (/api/mcp)</text>
  <rect x="144.0" y="202.0" width="536" height="536" rx="24" fill="rgba(55,224,200,0.09)" stroke="rgba(55,224,200,0.5)" stroke-width="1.5"/>
  <rect x="144.0" y="202.0" width="536" height="536" rx="24" fill="url(#sheen)" opacity="0.3"/>
  <circle class="node-pulse" cx="166.0" cy="222.0" r="4.5" fill="#37e0c8" opacity="0.4" filter="url(#glowS)"/>
  <circle cx="166.0" cy="222.0" r="3" fill="#87ecde"/>
<text x="412" y="222" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">Tool and resource catalog (lib/catalog.ts)</text>
  <rect x="196.0" y="254.0" width="432" height="432" rx="22" fill="rgba(255,77,94,0.09)" stroke="rgba(255,77,94,0.5)" stroke-width="1.5"/>
  <rect x="196.0" y="254.0" width="432" height="432" rx="22" fill="url(#sheen)" opacity="0.3"/>
  <circle class="node-pulse" cx="218.0" cy="274.0" r="4.5" fill="#ff4d5e" opacity="0.4" filter="url(#glowS)"/>
  <circle cx="218.0" cy="274.0" r="3" fill="#ff949e"/>
<text x="412" y="274" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">MCP Apps widget bundle</text>
  <rect x="248.0" y="306.0" width="328" height="328" rx="20" fill="rgba(124,92,255,0.09)" stroke="rgba(124,92,255,0.5)" stroke-width="1.5"/>
  <rect x="248.0" y="306.0" width="328" height="328" rx="20" fill="url(#sheen)" opacity="0.3"/>
  <circle class="node-pulse" cx="270.0" cy="326.0" r="4.5" fill="#ff8a3d, #37e0c8, #ff4d5e" opacity="0.4" filter="url(#glowS)"/>
  <circle cx="270.0" cy="326.0" r="3" fill="#b09dff"/>
<text x="412" y="326" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">Browser playground UI</text>
  <rect x="300.0" y="358.0" width="224" height="224" rx="18" fill="rgba(34,211,238,0.09)" stroke="rgba(34,211,238,0.5)" stroke-width="1.5"/>
  <rect x="300.0" y="358.0" width="224" height="224" rx="18" fill="url(#sheen)" opacity="0.3"/>
  <circle class="node-pulse" cx="322.0" cy="378.0" r="4.5" fill="#22d3ee" opacity="0.4" filter="url(#glowS)"/>
  <circle cx="322.0" cy="378.0" r="3" fill="#7ae5f5"/>
<text x="412" y="378" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">Five attributed</text>
<text x="412" y="395" font-family="ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="middle" dominant-baseline="central">dashboard templates</text>
<text x="412" y="857" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Monaco,Consolas,monospace" font-size="13" font-weight="400" fill="#7c8aa0" text-anchor="middle">The parts a reader must hold in mind: the endpoint, the tool and resource catalog, the</text>
<text x="412" y="876.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Monaco,Consolas,monospace" font-size="13" font-weight="400" fill="#7c8aa0" text-anchor="middle">widget bundle, and the attributed template set it renders.</text>
</svg>
